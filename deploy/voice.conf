# Optional. Turns on the voice session on a CV variant page: copy to
# /etc/systemd/system/nexus.service.d/voice.conf after reading "Voice" in README.md.
# Without this file Nexus makes no outbound call at all, and the page says voice is off.
[Service]
# GIVES UP the unit's outbound network filter. IPAddressDeny=any is what stops a compromised Nexus,
# or a bug in one of its dependencies, from sending the database anywhere. OpenAI's addresses aren't
# stable enough to list, so this lifts the filter for every destination, not only for OpenAI. In
# code the only outbound call is the POST that opens a voice session, over TLS, to a fixed address.
IPAddressDeny=

# The key stays out of the environment: systemd hands it over as a file only this service can read,
# and Nexus reads it once at start. Without this file on disk the service won't start.
LoadCredential=openai-api-key:/etc/nexus/openai-api-key
Environment=NEXUS_OPENAI_API_KEY_FILE=%d/openai-api-key

# Optional. These are the defaults.
#Environment=NEXUS_REALTIME_MODEL=gpt-realtime-2.1-mini
#Environment=NEXUS_REALTIME_VOICE=marin
#Environment=NEXUS_VOICE_SESSION_SECONDS=900
