[package]
name = "nexus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nexus_server"
path = "src/lib.rs"

[[bin]]
name = "nexus"
path = "src/main.rs"

[dependencies]
age.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["matched-path"] }
clap = { workspace = true, features = ["env"] }
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
nexus-auth.workspace = true
nexus-core.workspace = true
nexus-mcp.workspace = true
nexus-web.workspace = true
rpassword.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util = { version = "0.3", default-features = false }
reqwest.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
tower.workspace = true
