[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
nexus-auth = { path = "crates/auth" }
nexus-core = { path = "crates/core" }
nexus-web = { path = "crates/web" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
anyhow = "1"
argon2 = "0.5.3"
base64 = "0.22.1"
hmac = "0.12.1"
percent-encoding = "2.3.2"
rand = "0.10.3"
rpassword = "7.5.4"
url = "2.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "json", "derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
leptos = { version = "0.8.23", features = ["ssr"] }
regex = "1"
subtle = "2.6"
ical = "0.11"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tracing = "0.1"
age = { version = "0.12.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
tower-http = { version = "0.6.11", default-features = false, features = ["limit", "timeout"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
