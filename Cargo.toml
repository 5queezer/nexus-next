[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
nexus-auth = { path = "crates/auth" }
nexus-core = { path = "crates/core" }
nexus-mcp = { path = "crates/mcp" }
nexus-tailor = { path = "crates/tailor" }
nexus-web = { path = "crates/web" }

chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
reqwest = { version = "0.13.5", default-features = false }
rmcp = { version = "3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
anyhow = "1"
argon2 = "0.5.3"
base64 = "0.22.1"
hmac = "0.12.1"
percent-encoding = "2.3.2"
rand = "0.10.3"
rpassword = "7.5.4"
url = "2.5.8"
uuid = { version = "1.29.0", features = ["v4"] }
png = "=0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
similar = "=3.2.1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "json", "derive"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json", "form"] }
leptos = { version = "0.8.23", features = ["ssr"] }
regex = "1"
subtle = "2.6"
ical = "0.11"
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "tokio"] }
http-body-util = "0.1"
tracing = "0.1"
unicode-properties = { version = "0.1.5", default-features = false, features = ["general-category"] }
age = { version = "0.12.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
tower-http = { version = "0.6.11", default-features = false, features = ["limit", "timeout"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-render = "=0.15.1"
unicode-normalization = "0.1.26"
rustix = { version = "1.1.6", default-features = false, features = ["std", "param"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
